# Load only file listing, transfer, and TLS modules.
ModulePath /usr/lib/proftpd
LoadModule mod_ls.c
LoadModule mod_xfer.c
LoadModule mod_tls.c
ServerName "Webcrate FTP Server"
ServerType standalone
DefaultServer on
PassivePorts 50000 60000
Port 21
UseIPv6 off
Umask 022
MaxInstances 30
User nobody
Group nogroup
DefaultRoot ~
AllowOverwrite on
AllowOverride off
RequireValidShell off
RootLogin off
AuthUserFile /etc/ftp.passwd
AuthOrder mod_auth_file.c
PersistentPasswd off
UseLastlog off
WtmpLog off
PidFile /run/proftpd/proftpd.pid
ScoreboardFile /run/proftpd/proftpd.scoreboard
TLSEngine on
TLSRequired off
TLSProtocol TLSv1.2 TLSv1.3
TLSRSACertificateFile /webcrate/tls/server.crt
TLSRSACertificateKeyFile /webcrate/tls/server.key
TLSVerifyClient off
<Limit SITE_CHMOD>
  DenyAll
</Limit>
